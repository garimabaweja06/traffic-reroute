server.port=8080

# The area to download from OpenStreetMap (a box around Ambala Cantt). Change it to use another area,
# then delete the saved file below and restart.
traffic.osm.south=30.332
traffic.osm.west=76.818
traffic.osm.north=30.362
traffic.osm.east=76.852

# Roads are downloaded once, saved here, and reused on every later start.
traffic.osm.cache-file=data/ambala-cantt.json
traffic.osm.download=true
